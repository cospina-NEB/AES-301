# CI job for /infra: Bicep compile + lint on every run, what-if per environment on PRs that touch /infra.
# Publishes the "infra" pipeline artifact so deploy stages use exactly the files that were validated.

parameters:
  - name: environments
    type: object
    default: [dev, qa, staging, prod]

jobs:
  - job: ValidateInfra
    displayName: Validate infrastructure (Bicep)
    steps:
      - checkout: self
        fetchDepth: 0 # full history so the PR diff against the target branch works

      - bash: |
          set -euo pipefail
          if [ "$(Build.Reason)" != "PullRequest" ]; then
            echo "Not a PR build; skipping what-if."
            echo "##vso[task.setvariable variable=infraChanged]false"
            exit 0
          fi
          target="$(System.PullRequest.TargetBranch)"
          target="${target#refs/heads/}" # Azure Repos sends refs/heads/main, GitHub sends main
          git fetch --quiet origin "$target"
          if git diff --name-only "origin/$target...HEAD" | grep -q '^infra/'; then
            echo "PR touches /infra; what-if will run."
            echo "##vso[task.setvariable variable=infraChanged]true"
          else
            echo "PR does not touch /infra; skipping what-if."
            echo "##vso[task.setvariable variable=infraChanged]false"
          fi
        displayName: Detect /infra changes

      - bash: |
          set -euo pipefail
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for f in infra/params/*.bicepparam; do
            echo "Checking $f"
            az bicep build-params --file "$f" --stdout > /dev/null
          done
        displayName: Bicep build + lint

      - ${{ each env in parameters.environments }}:
          - task: AzureCLI@2
            displayName: What-if (${{ env }})
            condition: and(succeeded(), eq(variables['infraChanged'], 'true'))
            inputs:
              azureSubscription: sc-aes301-${{ env }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az deployment group what-if \
                  --resource-group rg-app-${{ env }} \
                  --template-file infra/main.bicep \
                  --parameters infra/params/${{ env }}.bicepparam \
                  --result-format FullResourcePayloads \
                  | tee "$(Build.ArtifactStagingDirectory)/whatif-${{ env }}.txt"

      - publish: $(Build.ArtifactStagingDirectory)
        artifact: whatif
        displayName: Publish what-if output
        condition: and(succeeded(), eq(variables['infraChanged'], 'true'))

      - publish: infra
        artifact: infra
        displayName: Publish pipeline artifact (infra)
